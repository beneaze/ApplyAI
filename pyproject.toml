[project]
name = "applyai"
version = "0.1.0"
description = "Daily job search with Claude: tailored one-page CVs and cover letters for every good fit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pyyaml>=6.0", "pdfminer.six>=20231228"]

[project.scripts]
applyai = "applyai.cli:main"

[tool.setuptools]
packages = ["applyai", "applyai.sources"]

[tool.setuptools.package-data]
applyai = ["templates/*", "examples/*", "examples/profile/*"]
